<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彾九平的个人博客</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">彾九平</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>欢迎来到我的技术博客</h1>
            <p>记录学习心得、技术笔记与生活感悟</p>
        </section>

        <section class="posts-section">
            <h2>最新文章</h2>
            <div id="posts-container">
                <!-- 文章列表将通过JavaScript动态加载 -->
                <div class="loading">正在加载文章...</div>
            </div>
        </section>

        <section id="about" class="about-section">
            <h2>关于我</h2>
            <div class="about-content">
                <p>一名热爱技术的开发者，喜欢探索新技术并记录学习过程。</p>
            </div>
        </section>

        <section id="contact" class="contact-section">
            <h2>联系我</h2>
            <div class="contact-links">
                <a href="https://github.com/yourusername" target="_blank">GitHub</a>
                <a href="mailto:gvd45@qq.com">Email</a>
                <a href="https://twitter.com/yourusername" target="_blank">Twitter</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 我的个人博客 | 使用Markdown驱动</p>
        </div>
    </footer>

    <!-- 引入Markdown解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
