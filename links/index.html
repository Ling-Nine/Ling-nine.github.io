<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友情链接 - 彾九平</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="../index.html" class="logo-link">
                    <img class="logo-avatar" src="../posts/images/test/头像.png" alt="avatar">
                    <span class="logo-text">彾九平</span>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">首页</a></li>
                <li><a href="../index.html#about">关于</a></li>
                <li><a href="index.html" class="active">友链</a></li>
                <li><a href="../index.html#contact">联系</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="links-section">
            <h2>友情链接</h2>
            <p class="links-desc">这里收录了一些我觉得不错的博客和网站，欢迎互访 ☕</p>

            <div class="links-grid">
                <!--
                    友链卡片模板，复制下面的 <a> 块即可新增一条：
                    avatar : 头像图片路径（建议 100x100 正方形）
                    name   : 站点名称
                    href   : 跳转链接（加 target="_blank" 新窗口打开）
                    desc   : 一句话描述

                <a class="link-card" href="https://example.com" target="_blank" rel="noopener">
                    <img class="link-avatar" src="../posts/images/test/头像.png" alt="示例博客">
                    <div class="link-info">
                        <div class="link-name">示例博客</div>
                        <div class="link-desc">这是一个示例友链卡片，替换 href/src/文字即可</div>
                    </div>
                </a>
                -->
                <a class="link-card" href="https://www.gmaxh.site/" target="_blank" rel="noopener">
                    <img class="link-avatar" src="https://www.gmaxh.site/favicon/avatar.jpeg" alt="雨停之后">
                    <div class="link-info">
                        <div class="link-name">雨停之后</div>
                        <div class="link-desc">想把我唱给你听,趁现在年少如花。</div>
                    </div>
                </a>

                <!-- 在这里继续添加更多友链卡片... -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 彾九平 | <a href="../index.html">返回首页</a></p>
        </div>
    </footer>
</body>
</html>
